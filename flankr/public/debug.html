<!DOCTYPE html>
<html>

<head>
  <title>Flankr Local Debugger</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #eee;
      padding: 20px;
    }

    .frame-container {
      border: 1px solid #333;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
      border-radius: 8px;
      background: #000;
    }

    .frame-image {
      width: 100%;
      aspect-ratio: 1.91/1;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .frame-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .buttons {
      display: grid;
      gap: 10px;
      margin-top: 20px;
      grid-template-columns: repeat(2, 1fr);
    }

    button {
      padding: 10px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #ccc;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      background: #222;
      border: 1px solid #444;
      color: white;
    }

    #log {
      margin-top: 20px;
      white-space: pre-wrap;
      font-family: monospace;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="frame-container">
    <h2>Flankr Local Debugger</h2>
    <div class="frame-image" id="frameImage">Loading...</div>
    <input type="text" id="inputText" placeholder="Enter value (Price/Slippage)...">
    <div class="buttons" id="buttons"></div>
  </div>
  <div id="log"></div>

  <script>
    const baseUrl = 'http://localhost:3001/api';
    let currentState = {};

    async function loadFrame(url = '/price', method = 'POST', payload = {}) {
      document.getElementById('log').innerText += `\n> ${method} ${url}`;

      try {
        let fetchUrl;
        if (url.startsWith('http')) {
          fetchUrl = url;
        } else {
          fetchUrl = baseUrl + (url.startsWith('/') ? url : '/' + url);
        }

        // Log the calculated URL to be sure
        document.getElementById('log').innerText += `\n[Fetch] ${fetchUrl}`;

        const bodyPayload = {
          untrustedData: {
            buttonIndex: payload.buttonIndex || 1,
            inputText: document.getElementById('inputText').value || "",
            ...payload
          }
        };

        // Attach state if we have it
        if (currentState) {
          bodyPayload.state = currentState;
        }
        const res = await fetch(fetchUrl, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: method === 'POST' ? JSON.stringify(bodyPayload) : undefined
        });

        // Log status
        const statusLine = `[Status] ${res.status} ${res.statusText}`;
        const typeLine = `[Type] ${res.headers.get('content-type')}`;
        document.getElementById('log').innerText += `\n${statusLine}\n${typeLine}`;

        const text = await res.text();
        // Verbose logging of body (truncated) to help debug error pages
        const bodyPreview = text.length > 500 ? text.substring(0, 500) + '...' : text;
        document.getElementById('log').innerText += `\n[Body] ${bodyPreview.replace(/\n/g, ' ')}`;

        // Try parsing as JSON first (Transaction data)
        try {
          const txData = JSON.parse(text);
          if (txData.chainId || txData.method || txData.params || txData.to || txData.data) {
            document.getElementById('log').innerText += `\n[TX DATA FOUND]`;

            // Show Success UI
            document.getElementById('frameImage').innerHTML = `<div style="color:#4ade80; text-align:center; padding:40px;">
                            <h3 style="margin-bottom:10px">✅ Simulation Successful</h3>
                            <div style="color:#aaa; font-size:12px; margin-bottom:20px;">(Wallet signatures are not supported locally)</div>
                            <div style="background:#111; padding:10px; border-radius:4px; text-align:left; font-family:monospace; margin-bottom:10px;">
                                <div>Function: approve</div>
                                <div>Target: ${txData.to}</div>
                                <div>Value: ${txData.value}</div>
                            </div>
                            <pre style="text-align:left; font-size:10px; overflow:auto; max-height:100px; opacity:0.6">${JSON.stringify(txData, null, 2)}</pre>
                        </div>`;
            document.getElementById('buttons').innerHTML = '<button onclick="location.reload()">Restart</button>';
            document.getElementById('inputText').style.display = 'none'; // Hide input on success
            return;
          }
        } catch (e) {
          // Not JSON, continue to HTML parsing
        }

        // Parse Frame Data from HTML
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');

        // Toggle Input Visibility
        const hasInput = doc.querySelector('meta[name="fc:frame:input:text"]') || doc.querySelector('meta[property="fc:frame:input:text"]');
        document.getElementById('inputText').style.display = hasInput ? 'block' : 'none';

        // Debug: Log all meta tags
        const metas = doc.querySelectorAll('meta');
        let metaLog = "Found Metas:";
        metas.forEach(m => {
          const name = m.getAttribute('name') || m.getAttribute('property');
          if (name) {
            if (name.includes('fc:frame:state')) {
              currentState = m.content;
              metaLog += `\n- [STATE UPDATED]`;
            }
            if (name.includes('fc:frame') || name.includes('og:image')) {
              metaLog += `\n- ${name}: ${m.content}`;
            }
          }
        }); document.getElementById('log').innerText += `\n${metaLog}`;

        // Extract Image (Support name or property)
        const ogImage = doc.querySelector('meta[property="og:image"]')?.content
          || doc.querySelector('meta[name="fc:frame:image"]')?.content
          || doc.querySelector('meta[property="fc:frame:image"]')?.content;

        const imageEl = document.getElementById('frameImage');
        if (ogImage) {
          let finalImgUrl;
          try {
            // Construct the current frame's base URL (e.g. http://localhost:3001/api/price)
            // treating it as a directory so relative paths like "image" resolve to ".../price/image"
            let frameBase = baseUrl + (url.startsWith('/') ? url : '/' + url);
            if (!frameBase.endsWith('/')) frameBase += '/'; // Force directory semantics

            finalImgUrl = new URL(ogImage, frameBase).href;
          } catch (e) {
            finalImgUrl = ogImage; // Fallback
          }

          document.getElementById('log').innerText += `\n[Image] ${finalImgUrl}`;
          imageEl.innerHTML = `<img src="${finalImgUrl}" onerror="this.parentElement.innerText='Failed to load: ' + this.src" />`;
        } else {
          imageEl.innerHTML = '<div style="padding:20px">No Image Metadata Found</div>';
        }     // Extract Buttons
        const buttonContainer = document.getElementById('buttons');
        buttonContainer.innerHTML = '';

        for (let i = 1; i <= 4; i++) {
          // Try both name and property
          const btnLabel = doc.querySelector(`meta[name="fc:frame:button:${i}"]`)?.content
            || doc.querySelector(`meta[property="fc:frame:button:${i}"]`)?.content;

          const btnAction = doc.querySelector(`meta[name="fc:frame:button:${i}:action"]`)?.content
            || doc.querySelector(`meta[property="fc:frame:button:${i}:action"]`)?.content
            || 'post';

          const btnTarget = doc.querySelector(`meta[name="fc:frame:button:${i}:target"]`)?.content
            || doc.querySelector(`meta[property="fc:frame:button:${i}:target"]`)?.content;

          if (btnLabel) {
            const btn = document.createElement('button');
            btn.innerText = btnLabel + (btnAction === 'link' ? ' ↗' : '');
            btn.onclick = () => {
              if (btnAction === 'link') {
                window.open(btnTarget, '_blank');
              } else if (btnAction === 'tx') {
                // Perform the TX fetch
                loadFrame(btnTarget || url, 'POST', { buttonIndex: i });
              } else {
                // Standard POST
                const target = btnTarget || url;
                // Pass target directly to loadFrame, which now handles absolute paths
                loadFrame(target, 'POST', { buttonIndex: i });
              }
            };
            buttonContainer.appendChild(btn);
          }
        }

        // Reset Input
        document.getElementById('inputText').value = '';

      } catch (e) {
        document.getElementById('log').innerText += `\nERROR: ${e.message}`;
      }
    }

    // Initialize
    loadFrame('/price', 'POST'); // Start at /price since / is broken
  </script>
</body>

</html>
