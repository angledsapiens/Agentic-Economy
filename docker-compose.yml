services:
  sdk-node:
    build:
      context: ./liquidity-intents-sdk/v0
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - LIS_MODE=TESTNET
    volumes:
      - ./liquidity-intents-sdk/v0/.env:/app/.env
      - ./liquidity-intents-sdk/v0/Policy.json:/app/Policy.json

  playground-ui:
    build:
      context: ./packages/playground-ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - sdk-node

  mock-peer:
    build:
      context: ./liquidity-intents-sdk/v0
      dockerfile: Dockerfile
    environment:
      - LIS_MODE=TESTNET
      - PROVIDER_DID=did:pkh:0xMockPeer
    command: [ "sh", "-c", "sleep 10 && npm run start:agent" ] # Placeholder start helper
